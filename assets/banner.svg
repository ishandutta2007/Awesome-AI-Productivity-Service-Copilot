<svg width="100%" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse-orb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.75; }
    }
    @keyframes pulse-orb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.2) translate(-25px, 20px); opacity: 0.65; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes float-dot {
      0%, 100% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-8px); opacity: 0.9; }
    }
    .orb-1 { animation: pulse-orb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulse-orb2 10s ease-in-out infinite; transform-origin: 1000px 180px; }
    .stream-line { stroke-dasharray: 6 12; animation: dash 2.5s linear infinite; }
    .floating-dot-1 { animation: float-dot 3s ease-in-out infinite; }
    .floating-dot-2 { animation: float-dot 4s ease-in-out infinite 1s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="280" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Glowing Background Orbs (Stay Strictly in Background) -->
  <g filter="url(#blur-glow)">
    <circle class="orb-1" cx="220" cy="110" r="130" fill="#4f46e5" />
    <circle class="orb-2" cx="980" cy="160" r="140" fill="#06b6d4" />
    <circle class="orb-1" cx="600" cy="240" r="100" fill="#9333ea" opacity="0.3" />
  </g>

  <!-- Grid Overlay -->
  <rect width="1200" height="280" rx="16" fill="url(#grid)" />

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Animated Cybernetic Flow Lines in Background -->
  <g opacity="0.45">
    <path class="stream-line" d="M 50 220 Q 300 260 600 220 T 1150 230" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 80 60 Q 400 20 800 60 T 1120 40" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="floating-dot-1" cx="180" cy="70" r="3" fill="#38bdf8" />
  <circle class="floating-dot-2" cx="1020" cy="80" r="2.5" fill="#c084fc" />
  <circle class="floating-dot-1" cx="1090" cy="200" r="3.5" fill="#818cf8" />
  <circle class="floating-dot-2" cx="110" cy="180" r="2" fill="#34d399" />

  <!-- Foreground Content: Pill Tag -->
  <g transform="translate(600, 52)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text text-anchor="middle" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">⚡ CURATED AI COPILOTS &amp; AGENTS</text>
  </g>

  <!-- Foreground Content: Main Title -->
  <text x="600" y="126" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">
    Awesome AI Productivity &amp; Service Copilot
  </text>

  <!-- Foreground Content: Subtitle -->
  <text x="600" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Enterprise SaaS Copilots • Open-Source Agent Frameworks • Self-Hosted Agent Assist
  </text>

  <!-- Foreground Content: Feature Highlights -->
  <g transform="translate(600, 218)">
    <!-- Pill 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🤖 AI Agent Assist</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-105, 0)">
      <rect x="-95" y="-13" width="190" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8">📝 Drafting &amp; Summaries</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(110, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c084fc">🔒 Self-Hosted &amp; HITL</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(315, 0)">
      <rect x="-85" y="-13" width="170" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">⚡ Real-Time Omnichannel</text>
    </g>
  </g>
</svg>
